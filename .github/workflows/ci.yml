name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Resolve package dependencies
        run: swift package resolve

      - name: Build Swift package
        run: swift build

      - name: Run Swift package tests
        run: swift test --parallel

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build macOS app
        run: |
          xcodebuild build \
            -project NeoClash.xcodeproj \
            -scheme NeoClash \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: core/mobile/go.mod
          cache-dependency-path: core/mobile/go.sum

      - name: Test embedded core
        working-directory: core/mobile
        run: go test ./engine/

      - name: Build embedded core
        run: ./scripts/build-ios-core.sh

      - name: Build iOS targets
        run: |
          for scheme in 'NeoClash iOS' 'NeoClash iOS Local'; do
            xcodebuild build \
              -project NeoClash.xcodeproj \
              -scheme "$scheme" \
              -destination 'generic/platform=iOS Simulator' \
              CODE_SIGNING_ALLOWED=NO
          done

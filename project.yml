name: NeoClash
options:
  bundleIdPrefix: com.pengrao
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.2"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # The embedded core is built for Apple Silicon only.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
packages:
  Yams:
    url: https://github.com/jpsim/Yams.git
    from: 6.0.0
iosInfo: &iosInfo
  CFBundleDisplayName: NeoClash
  CFBundleShortVersionString: $(MARKETING_VERSION)
  CFBundleVersion: $(CURRENT_PROJECT_VERSION)
  ITSAppUsesNonExemptEncryption: false
  UILaunchScreen: {}
  UISupportedInterfaceOrientations:
    - UIInterfaceOrientationPortrait
    - UIInterfaceOrientationLandscapeLeft
    - UIInterfaceOrientationLandscapeRight
  UISupportedInterfaceOrientations~ipad:
    - UIInterfaceOrientationPortrait
    - UIInterfaceOrientationPortraitUpsideDown
    - UIInterfaceOrientationLandscapeLeft
    - UIInterfaceOrientationLandscapeRight
targetTemplates:
  NeoClashIOSApp:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 273WQ3834Q
targets:
  NeoClashMobileCore:
    type: framework
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - NeoClashMobile
      - NeoClash/Models
      - NeoClash/Stores
      - NeoClash/Helpers
      - NeoClash/Services/ProfileStore.swift
      - NeoClash/Services/SubscriptionService.swift
      - NeoClash/Services/KeychainStore.swift
      - NeoClash/Core/MihomoAPIClient.swift
      - NeoClash/Core/MihomoWebSocketClient.swift
      - NeoClash/Core/RuntimeConfigBuilder.swift
      - NeoClash/Core/SecurePathValidator.swift
      - NeoClash/Core/CoreBinaryValidator.swift
    dependencies:
      - package: Yams
      - framework: core/mobile/build/NeoClashEngine.xcframework
        embed: false
      - sdk: libresolv.tbd
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pengrao.NeoClashMobileCore
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 273WQ3834Q
        APPLICATION_EXTENSION_API_ONLY: YES
  NeoClashCore:
    type: framework
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - NeoClash/Models
      - NeoClash/Stores
      - NeoClash/Services
      - NeoClash/Core
      - NeoClash/Helpers
    dependencies:
      - package: Yams
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pengrao.NeoClashCore
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
  NeoClash:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - NeoClash/App
      - NeoClash/Views
      - NeoClash/Resources/Assets.xcassets
      - path: NeoClash/Resources/Core
        type: folder
        buildPhase: resources
      - path: NeoClash/Resources/Geo
        type: folder
        buildPhase: resources
    dependencies:
      - target: NeoClashCore
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pengrao.NeoClash
        INFOPLIST_FILE: NeoClash/App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
  # Full build: the core runs in the packet tunnel. Needs the paid Network Extension capability.
  NeoClashIOS:
    templates: [NeoClashIOSApp]
    sources:
      - path: NeoClashIOS/App
        excludes:
          - Info.plist
          - NeoClashIOS.entitlements
      - NeoClashIOS/Services
      - NeoClashIOS/Views
      - NeoClashIOS/Resources/Assets.xcassets
      - path: NeoClash/Resources/Geo/country.mmdb
        buildPhase: resources
      - path: NeoClash/Resources/Geo/geosite.dat
        buildPhase: resources
    dependencies:
      - target: NeoClashMobileCore
        embed: true
        codeSign: true
      - target: NeoClashPacketTunnel
        embed: true
        codeSign: true
    info:
      path: NeoClashIOS/App/Info.plist
      properties: *iosInfo
    entitlements:
      path: NeoClashIOS/App/NeoClashIOS.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - group.com.pengrao.NeoClash
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pengrao.NeoClash.iOS
  # Free-signable build: the core runs inside the app, so it needs no entitlements, but it carries
  # no device traffic and stops when the app is suspended.
  NeoClashIOSLocal:
    templates: [NeoClashIOSApp]
    sources:
      - path: NeoClashIOS/App
        excludes:
          - Info.plist
          - NeoClashIOS.entitlements
      - path: NeoClashIOS/Services
        excludes:
          - IOSTunnelController.swift
          - TunnelEngineHost.swift
      - NeoClashIOS/Views
      - NeoClashIOS/Resources/Assets.xcassets
      - path: NeoClash/Resources/Geo/country.mmdb
        buildPhase: resources
      - path: NeoClash/Resources/Geo/geosite.dat
        buildPhase: resources
    dependencies:
      - target: NeoClashMobileCore
        embed: true
        codeSign: true
    info:
      path: NeoClashIOS/App/InfoLocal.plist
      properties: *iosInfo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pengrao.NeoClash.iOS.local
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) NEOCLASH_LOCAL_ENGINE
  NeoClashPacketTunnel:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - NeoClashPacketTunnel
    dependencies:
      - sdk: NetworkExtension.framework
      - target: NeoClashMobileCore
        embed: false
        link: true
    info:
      path: NeoClashPacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: NeoClash Tunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: NeoClashPacketTunnel/NeoClashPacketTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - group.com.pengrao.NeoClash
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pengrao.NeoClash.iOS.PacketTunnel
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 273WQ3834Q
  NeoClashTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - Tests/NeoClashCoreTests
    dependencies:
      - target: NeoClashCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pengrao.NeoClashTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NeoClash:
    build:
      targets:
        NeoClashCore: all
        NeoClash: all
    test:
      targets:
        - NeoClashTests
  NeoClash iOS:
    build:
      targets:
        NeoClashMobileCore: all
        NeoClashPacketTunnel: all
        NeoClashIOS: all
  NeoClash iOS Local:
    build:
      targets:
        NeoClashMobileCore: all
        NeoClashIOSLocal: all
